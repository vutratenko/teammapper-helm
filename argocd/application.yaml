apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teammapper
  namespace: shturval-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: teammapper
  source:
    repoURL: https://github.com/vutratenko/teammapper-helm.git
    targetRevision: main
    path: .
    helm:
      releaseName: teammapper
      valueFiles:
        - values.sion2k.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: teammapper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
