{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "teammapper.fullname" . }}
  labels:
    {{- include "teammapper.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                {{- if eq .Values.ingress.backend "gateway" }}
                {{- if not .Values.gatewayApi.enabled }}
                {{- fail "ingress.backend=gateway requires gatewayApi.enabled=true" }}
                {{- end }}
                name: {{ include "teammapper.gatewayServiceName" . }}
                port:
                  number: {{ .Values.gatewayApi.listener.port }}
                {{- else if eq .Values.ingress.backend "service" }}
                name: {{ include "teammapper.fullname" . }}
                port:
                  name: http
                {{- else }}
                {{- fail "ingress.backend must be service or gateway" }}
                {{- end }}
{{- end }}
