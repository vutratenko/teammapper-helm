apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "teammapper.fullname" . }}-test-connection"
  labels:
    {{- include "teammapper.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      args:
        - --fail
        - --show-error
        - --silent
        - http://{{ include "teammapper.fullname" . }}:{{ .Values.service.port }}/
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
