config:
  deleteAfterDays: 365
  postgresSsl: true

ingress:
  enabled: true
  # Set to service for an immediate rollback to direct NGINX routing.
  backend: gateway
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: corp-acme
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Cilium Gateway Services have no EndpointSlices for ingress-nginx to use.
    nginx.ingress.kubernetes.io/service-upstream: "true"
  host: teammapper.sion2k.ru
  tls:
    enabled: true
    secretName: teammapper-tls

gatewayApi:
  enabled: true
  className: cilium
  addresses:
    - 192.168.88.113

postgresql:
  volume:
    size: 10Gi
    storageClass: proxmox-data-xfs
