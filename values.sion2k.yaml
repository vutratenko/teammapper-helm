config:
  deleteAfterDays: 365
  postgresSsl: true

ingress:
  enabled: true
  # Phase one keeps production traffic direct. Change to gateway only after
  # Gateway and HTTPRoute conditions are healthy and internal tests pass.
  backend: service
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: corp-acme
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: teammapper.sion2k.ru
  tls:
    enabled: true
    secretName: teammapper-tls

gatewayApi:
  enabled: true
  className: cilium
  addresses:
    - 192.168.88.113

postgresql:
  volume:
    size: 10Gi
    storageClass: proxmox-data-xfs
