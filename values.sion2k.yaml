config:
  deleteAfterDays: 3650
  postgresSsl: true

ingress:
  enabled: false
  # Set to service for an immediate rollback to direct NGINX routing.
  backend: gateway
  sharedGatewayServiceName: cilium-gateway-public
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: corp-acme
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Cilium Gateway Services have no EndpointSlices for ingress-nginx to use.
    nginx.ingress.kubernetes.io/service-upstream: "true"
  host: teammapper.sion2k.ru
  tls:
    enabled: true
    secretName: teammapper-tls

# Per-app Gateway removed; routing is HTTPRoute → shared Gateway `public` (see sion2k-gateway GitOps).
gatewayApi:
  enabled: false

postgresql:
  volume:
    size: 10Gi
    storageClass: proxmox-data-xfs
