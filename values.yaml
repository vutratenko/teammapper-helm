replicaCount: 1

image:
  repository: ghcr.io/b310-digital/teammapper
  tag: v0.3.7-1
  digest: sha256:a48e4e01c0361c69743374b7ae1416692993bf3f2bc173d892af11474c890538
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  # service routes directly to TeamMapper; gateway routes through the
  # Cilium-generated cilium-gateway-<gateway name> Service.
  backend: service
  className: nginx
  annotations: {}
  host: teammapper.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: teammapper-tls

gatewayApi:
  enabled: false
  className: cilium
  addresses: []
  listener:
    name: http
    port: 80
    protocol: HTTP
  route:
    path: /
    pathType: PathPrefix

config:
  mode: PROD
  binding: 0.0.0.0
  deleteAfterDays: 30
  aiEnabled: false
  logLevel: warn
  postgresSsl: false
  postgresSslRejectUnauthorized: false
  postgresQueryTimeout: 100000
  postgresStatementTimeout: 100000

existingSecret: teammapper-app
existingSecretJwtKey: jwt-secret

postgresql:
  enabled: true
  teamId: teammapper
  instances: 1
  version: "15"
  database: teammapper
  user: teammapper
  volume:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  existingHost: ""
  existingPort: 5432
  existingCredentialsSecret: ""
  existingCredentialsUserKey: username
  existingCredentialsPasswordKey: password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
